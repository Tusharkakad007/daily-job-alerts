name: Twice Daily Job Alert

on:
  schedule:
    # 8:00 AM IST (2:30 AM UTC) and 6:00 PM IST (12:30 PM UTC)
    - cron: '30 2,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install python-jobspy pandas

      - name: Run Job Pipeline
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: python fetch_jobs.py

      - name: Commit Deduplication History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff-index --quiet HEAD || (git commit -m "Update seen jobs history" && git push)
